controller:
  hero_chassis_controller:
    type: hero_chassis_controller/HeroChassisController
    publish_rate: 100
    timeout: 0.1
    frame_mode: base
    wheel_radius: 0.07625 #/rm_description_for_task/urdf/common/mecanum_wheel.urdf.xacro
    wheel_base: 0.4 #/rm_description_for_task/urdf/hero/chassis.urdf.xacro
    wheel_track: 0.4  #/rm_description_for_task/urdf/hero/chassis.urdf.xacro
    joints: [ left_front_wheel_joints, right_front_wheel_joints,
              left_back_wheel_joints, right_back_wheel_joints ]

    wheel:
      left_front_wheel_joint: { p: 0.5, i: 0, d: 0, i_clamp_max: 0, i_clamp_min: 0, antiwindup: true, publish_state: true }
      right_front_wheel_joint: { p: 0.5, i: 0, d: 0, i_clamp_max: 0, i_clamp_min: 0, antiwindup: true, publish_state: true }
      left_back_wheel_joint: { p: 0.5, i: 0, d: 0, i_clamp_max: 0, i_clamp_min: 0, antiwindup: true, publish_state: true }
      right_back_wheel_joint: { p: 0.5, i: 0, d: 0, i_clamp_max: 0, i_clamp_min: 0, antiwindup: true, publish_state: true }

  joint_state_controller:
    type: joint_state_controller/JointStateController
    publish_rate: 50