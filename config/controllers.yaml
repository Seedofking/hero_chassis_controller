controller:
  hero_chassis_controller:
    type: hero_chassis_controller/HeroChassisController
    publish_rate: 100
    timeout: 0.5
    frame_mode: world
    use_velocity_ramp: true
    velocity_ramp_step: 0.002
    wheel_radius: 0.07625 #/rm_description_for_task/urdf/common/mecanum_wheel.urdf.xacro
    wheel_base: 0.4 #/rm_description_for_task/urdf/hero/chassis.urdf.xacro, pose x = wheel_base / 2
    wheel_track: 0.4  #/rm_description_for_task/urdf/hero/chassis.urdf.xacro, pose y = wheel_track / 2
    joints: [ left_front_wheel_joint, right_front_wheel_joint,
              left_back_wheel_joint, right_back_wheel_joint ]

    wheel:
      left_front_wheel_joint:
        pid: { p: 1.5, i: 0.2, d: 0, i_clamp_max: 1, i_clamp_min: -1, antiwindup: true, publish_state: true }
        pose: { x: 0.2, y: 0.2, roller_angle: -0.785 }
      right_front_wheel_joint:
        pid: { p: 1.5, i: 0.2, d: 0, i_clamp_max: 1, i_clamp_min: -1, antiwindup: true, publish_state: true }
        pose: { x: 0.2, y: -0.2, roller_angle: 0.785 }
      left_back_wheel_joint:
        pid: { p: 1.5, i: 0.2, d: 0, i_clamp_max: 1, i_clamp_min: -1, antiwindup: true, publish_state: true }
        pose: { x: -0.2, y: 0.2, roller_angle: 0.785 }
      right_back_wheel_joint:
        pid: { p: 1.5, i: 0.2, d: 0, i_clamp_max: 1, i_clamp_min: -1, antiwindup: true, publish_state: true }
        pose: { x: -0.2, y: -0.2, roller_angle: -0.785 }

  joint_state_controller:
    type: joint_state_controller/JointStateController
    publish_rate: 50